name: Go

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/go.yml"

jobs:
  build:
    # The server targets Windows (named pipe IPC), so build on Windows only.
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # Single source of truth for the toolchain version: the "go" directive in
      # server/go.mod. Local machines only need Go >= that version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Build
        run: go build -trimpath -ldflags "-s -w" ./...

      - name: Vet
        run: go vet ./...

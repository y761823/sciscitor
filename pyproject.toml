[project]
name = "sciscitor"
version = "0.1.0"
description = "Desktop chat client for OpenAI-compatible models"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pyside6-essentials>=6.9",
    "python-dotenv>=1.0",
    "qasync>=0.27",
]

[project.scripts]
sciscitor = "sciscitor.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciscitor"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
